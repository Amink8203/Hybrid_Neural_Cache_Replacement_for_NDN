   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142c43" x="40.32" y="30.24" transform="rotate(-0 40.32 30.24)">A hybrid policy for each router</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566b80" x="40.32" y="57.96" transform="rotate(-0 40.32 57.96)">Recent popularity provides the prior. Two LSTMs learn a bounded adjustment.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142c43" x="68.544" y="132.659063" transform="rotate(-0 68.544 132.659063)">1  Name encoder</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #566b80" transform="translate(68.544 162.458203)">Hashed components + embedding</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #566b80" transform="translate(68.544 179.704789)">Name LSTM · hidden size 48</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142c43" x="396.144" y="132.600469" transform="rotate(-0 396.144 132.600469)">2  Request history</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #566b80" transform="translate(396.144 162.458203)">Local Interest sequence</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #566b80" transform="translate(396.144 179.704789)">Context LSTM · hidden size 64</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142c43" x="723.744" y="132.659063" transform="rotate(-0 723.744 132.659063)">3  Router-local state</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #566b80" transform="translate(723.744 162.458203)">Independent context at each router</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #566b80" transform="translate(723.744 179.704789)">Shared model within a topology</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566b80" x="50.4" y="216.72" transform="rotate(-0 50.4 216.72)">Updated for every local Interest</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f8c" x="50.4" y="277.2" transform="rotate(-0 50.4 277.2)">WHEN A FULL CACHE NEEDS REPLACEMENT</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142c43" x="68.544" y="339.299062" transform="rotate(-0 68.544 339.299062)">4  LRU shortlist</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #566b80" transform="translate(68.544 369.098203)">16 cached packets</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #566b80" transform="translate(68.544 386.344789)">8 oldest residents become candidates</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f8c" x="396.144" y="339.299062" transform="rotate(-0 396.144 339.299062)">5  Retention score</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #566b80" transform="translate(396.144 369.098203)">Prior + bounded neural residual</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #566b80" transform="translate(396.144 386.344789)">Candidate name + context + 8 features</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142c43" x="723.744" y="339.299062" transform="rotate(-0 723.744 339.299062)">6  Replace a packet</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #566b80" transform="translate(723.744 369.098203)">Evaluation: evict lowest score</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #566b80" transform="translate(723.744 386.344789)">RL training: sample a victim</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f8c" x="519.12" y="249.995312" transform="rotate(-0 519.12 249.995312)">Context</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f8c" x="50.4" y="451.08" transform="rotate(-0 50.4 451.08)">TRAINING</text>
   </g>
   <g id="text_19">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142c43" x="161.28" y="451.08" transform="rotate(-0 161.28 451.08)">Future-reuse ranking pretraining  →  REINFORCE  →  Validation selects the checkpoint</text>
   </g>
   <g id="text_20">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566b80" x="50.4" y="476.28" transform="rotate(-0 50.4 476.28)">The retention score ranks candidates; it is not a calibrated reuse probability.</text>
   </g>
